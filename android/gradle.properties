org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# These flags were added by the Flutter template.
#
# 20260731 gjw Both must stay false, and AGP must stay on 8.x, because
# the plugin set cannot agree on AGP 9's built-in Kotlin:
#
#   - file_picker 11.x applies kotlin-android only when AGP < 9, so on
#     AGP 9 it needs builtInKotlin=true or its Kotlin never compiles
#     ("cannot find symbol class FilePickerPlugin").
#   - fast_rsa 3.8.6 (via solidpod) applies kotlin-android
#     unconditionally, which AGP 9 rejects outright when built-in Kotlin
#     is on.
#
# On AGP 8 both apply kotlin-android and both build. Revisit once
# fast_rsa and the other Kotlin plugins adopt the AGP-9 conditional:
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
